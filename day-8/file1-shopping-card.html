<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #f5f5f5;
            color: #222;
        }
        header{
            background: #111827;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            font-size: 28px;
            font-weight: bold;
        }
        .cart-icon{
            background: #2563ed;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        #cartCount{
            background: red;
            color: white;
            padding: 3px 8px;
            border-radius: 50%;
            margin-left: 5px;
        }
        .hero{
            padding: 70px 7%;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #2563ed, #7c3aed);
        }
        .hero h1{
            font-size: 50px;
            margin-bottom: 15px;
        }
        .hero p{
            font-size: 18px;
        }
        .container{
            width: 1200px;
            max-width: 90%;
            margin: 50px auto;
        }
        .section-title{
            text-align: center;
            font-size: 35px;
            margin-bottom: 40px;
        }
        .products{
            display: flex;
            grid-template-columns: repeat(auto-fit,minmax(250px, 1fr));
            gap: 25px;
        }
        .product{
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
            transition: .3s;
        }
        .product:hover{
            transform: translateY(-10px);
        }
        .product img{
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .product-info{
            padding: 20px;
        }
        .product-info h3{
            margin-bottom: 10px;
        }
        .price{
            font-size: 22px;
            color: #2563ed;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .add-btn{
            width: 100%;
            padding: 13px;
            border: none;
            background: #111827;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: .3s;
        }
        .add-btn:hover{
            background: #2563eb;
        }
        .cart-section{
            width: 1200px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    
</body>
</html>
