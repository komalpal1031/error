<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 850px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .left {
            padding: 50px;
            background: #2563eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            margin-bottom: 15px;
            font-size: 42px;
        }

        .left p {
            color: #dbeafe;
            line-height: 1.7;
        }

        .shield {
            margin-bottom: 25px;
            font-size: 65px;
        }

        .right {
            padding: 40px;
        }

        .right h2 {
            margin-bottom: 25px;
        }

        .password-box {
            margin-bottom: 25px;
            padding: 14px;
            background: #0f172a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #password {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 18px;
        }

        .copy-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: white;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #475569;
        }

        .setting {
            margin-bottom: 18px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting label {
            color: #cbd5e1;
        }

        #length {
            width: 60px;
            padding: 7px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        .option {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #16a34a;
        }

        #message {
            min-height: 20px;
            margin-top: 15px;
            color: #4ade80;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left {
                padding: 35px;
                text-align: center;
            }

            .left h1 {
                font-size: 34px;
            }

            .right {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="left">
            <div class="shield">🔐</div>
            <h1>Secure Password Generator</h1>
            <p>Create strong random passwords for your online accounts using different character combinations.</p>
        </section>

        <section class="right">
            <h2>Generate Password</h2>

            <div class="password-box">
                <input type="text" id="password" placeholder="Your password" readonly>
                <button class="copy-btn" onclick="copyPassword()">Copy</button>
            </div>

            <div class="setting">
                <div class="setting-row">
                    <label for="length">Password Length</label>
                    <input type="number" id="length" value="12" min="4" max="30">
                </div>
            </div>

            <div class="option">
                <label for="lowercase">Include Lowercase</label>
                <input type="checkbox" id="lowercase" checked>
            </div>

            <div class="option">
                <label for="uppercase">Include Uppercase</label>
                <input type="checkbox" id="uppercase" checked>
            </div>

            <div class="option">
                <label for="numbers">Include Numbers</label>
                <input type="checkbox" id="numbers" checked>
            </div>

            <div class="option">
                <label for="symbols">Include Symbols</label>
                <input type="checkbox" id="symbols">
            </div>

            <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
            <p id="message"></p>
        </section>
    </main>

    <script>
        function generatePassword() {
            let length = Number(document.getElementById("length").value);
            let useLower = document.getElementById("lowercase").checked;
            let useUpper = document.getElementById("uppercase").checked;
            let useNumbers = document.getElementById("numbers").checked;
            let useSymbols = document.getElementById("symbols").checked;

            let lower = "abcdefghijklmnopqrstuvwxyz";
            let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let numbers = "0123456789";
            let symbols = "!@#$%^&*";
            let characters = "";
            let password = "";

            if (useLower) characters += lower;
            if (useUpper) characters += upper;
            if (useNumbers) characters += numbers;
            if (useSymbols) characters += symbols;

            if (characters === "") {
                alert("Select at least one option.");
                return;
            }

            if (length < 4 || length > 30) {
                alert("Password length must be between 4 and 30.");
                return;
            }

            for (let i = 0; i < length; i++) {
                let randomIndex = Math.floor(Math.random() * characters.length);
                password += characters[randomIndex];
            }

            document.getElementById("password").value = password;
            document.getElementById("message").innerHTML = "New password generated!";
        }

        function copyPassword() {
            let password = document.getElementById("password").value;

            if (password === "") {
                alert("Generate a password first.");
                return;
            }

            navigator.clipboard.writeText(password);
            document.getElementById("message").innerHTML = "Password copied!";
        }

        generatePassword();
    </script>

</body>
</html>
