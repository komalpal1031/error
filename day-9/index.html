<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #f5f5f5;
            color: #222;
        }
        header{
            padding: 18px 7%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo{
            font-size: 26px;
            font-weight: bold;
        }
        .cart-icon{
            padding: 10px 18px;
            background: #2563ed;
            border-radius: 25px;
        }
        #cartCount{
            margin-top: 5px;
            padding: 3px 8px;
            background: #ef4444;
            border-radius: 50%;
        }
        .hero{
            padding: 60px 20px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }
        .hero h1{
            margin-bottom: 10px;
            font-size: 44px;
        }
        .hero p{
            font-size: 17px;
        }
        .container{
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }
        .title{
            margin-bottom: 30px;
            text-align: center;
            font-size: 32px;
        }
        .products{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product{
            overflow: hidden;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-6px);
        }
        .product img{
            width: 100%;
            height: 190px;
            object-fit: cover;
        }
        .product-info{
            padding: 18px;
        }
        .product-info h3{
            margin-bottom: 8px;
        }
        .price{
            margin-bottom: 14px;
            color: #2563eb;
            font-size: 20px;
            font-weight: bold;
        }
        .add-btn{
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #111827;
            color: white;
            cursor: pointer;
        }
        .add-btn:hover{
            background: #2563eb;
        }
        .cart-section{
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .cart-section h2{
            margin-bottom: 20px;
        }
        .cart-item{
            padding: 14px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-radius: 1px solid #ddd;
        }
        .cart-info h4{
            margin-bottom: 5px;
        }
        .cart-price{
            color: #2563eb;
            font-weight: bold;
        }
        .remove-btn{
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }
        .remove-btn:hover{
            background: #991b1b;
        }
        .empty{
            padding: 20px;
            color: #777;
            text-align: center;
        }
        .total-box{
            padding: 20px;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #eee;
        }
        .checkout{
            padding: 11px 22px;
            border: none;
            border-radius: 7px;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }
        .checkout:hover{
            background: #15803d;
        }
    </style>
</head>
<body>
<header>
    <div class="logo">ShopCart</div>
    <div class="cart-icon"><i class="fa-solid fa-cart-shopping"></i><span id="cartCount">0</span></div>
</header>
<section class="hero">
    <h1>Online shoping</h1>
    <p>Choose your favorite products and add them to your cart.</p>
</section>
<main class="container">
    <h2 class="title">Our Products</h2>
    <div class="products">
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=1" alt="Headphones">
           <h3>Wireless Headphone</h3> 
           <p class="price">&#8377;2499</p>
           <button class="add-btn" onclick="addToCart('Wireless Headphones', 2499)">Add to cart</button>
           </div>
        </div>
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=2" alt="Headphones">
           <h3>Smart Watch</h3> 
           <p class="price">&#8377;3499</p>
           <button class="add-btn" onclick="addToCart('Smart Watch', 2499)">Add to cart</button>
           </div>
        </div>
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=3" alt="Headphones">
           <h3>Running Shoes</h3> 
           <p class="price">&#8377;1999</p>
           <button class="add-btn" onclick="addToCart('Smart Watch', 2499)">Add to cart</button>
           </div>
        </div>
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=4" alt="Headphones">
           <h3>Travel Backpack</h3> 
           <p class="price">&#8377;1299</p>
           <button class="add-btn" onclick="addToCart('Travel Backpack', 2499)">Add to cart</button>
           </div>
        </div>
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=5" alt="Headphones">
           <h3>bluetooth Speaker</h3> 
           <p class="price">&#8377;1799</p>
           <button class="add-btn" onclick="addToCart('bluetooth Speaker', 2499)">Add to cart</button>
           </div>
        </div>
        <div class="product">
           <div class="product-info">
            <img src="https://picsum.photos/500/400?random=6" alt="Headphones">
           <h3>Digital Camera</h3> 
           <p class="price">&#8377;1299</p>
           <button class="add-btn" onclick="addToCart('Digital Camera', 2499)">Add to cart</button>
           </div>
        </div>
    </div>
</main>
<section class="cart-section">
    <h2><i class="fa-solid fa-cart-shopping"></i>Your Shpping Cart</h2>
    <div id="cartItems">
        <p class="empty">Your cart is empty.</p>
    </div>
    <div class="total-box">
     <h3>Total: &#8377;<span id="totalPrice">0</span></h3>
     <button class="checkout" onclick="checkout()">Checkout</button>
    </div>

</section>

<!-- script -->
    <script>
        let cart = [];
        function addToCart(name, price) {
            let product = {
                name: name,
                price: price 
            };
            cart.push(product);
            displayCart();
        }
        function displayCart(){
            let cartItems = document.getElementById("cartItems");
            let cartCount = document.getElementById("cartCount");
            let totalPrice = document.getElementById("totalPrice");
            cartItems.innerHTML = "";
            let total = 0;

            cart.forEach(function(product, index){
                let item = document.createElement("div");
                item.className = "cart-item";

                item.innerHTML =`
                <div class="cart-info">
                    <h4>${product.name}</h4>
                    <p class="cart-price">&#8377;${product.price}</p>
                    </div>
                    <button class="remove-btn" onclick="removeProduct(${index})">Remove</button>
                    `;
                    cartItems.appendChild(item);
                    total += product.price;
            });
            cartCount.innerHTML = cart.length;
            totalPrice.innerHTML = total;

            if (cart.length ===0) {
                cartItems.innerHTML = '<p class="empty">Your cart is empty.</p>'
            }


        }
        function removeProduct(index) {
            cart.splice(index, 1);
            displayCart();
        }
        function checkout(){
            if (cart.length ===0){
                alert("Your cart is empty!");
                return;
            }
            alert("Order placed successfully!");
            cart = [];
            displayCart();
        }
    </script>
</body>
</html>
