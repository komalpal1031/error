<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            padding: 40px 20px;
            background: #f1f5f9;
            color: #1e293b;
        }
        .container{
            width: 900px;
            max-width: 100%;
            margin: auto;
        }
        .header{
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1{
            margin-bottom: 8px;
            font-size: 38px;
        }
        .header p{
            color: #64748b;
        }
        .summary{
            margin-bottom: 25;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }
        .summary-card{
            padding: 22px;
            background: white;
            border-radius: 12pxx;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        .summary-card p{
            margin-bottom: 8px;
            color: #64748b;
        }
        .summary-card h2{
            font-size: 27px;
        }
        .income h2{
            color: #16a34a;
        }
        .expense h2{
            color: #16a34a;
        }
        .expense h2{
            color: #dc2626;
        }
        .balance h2{
            color: #2563eb;
        }
        .form-box{
            margin-bottom: 25px;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        .form-box h2{
            margin-bottom: 20px;
        }
        .form-grid{
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }
        input, select{
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }
        input:focus,
        select:focus{
            border-color: #2563eb;
        }
        .add-btn{
            width: 1005;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .add-btn:hover{
            background: #1d4ed8;
        }
        .transacton-box{
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        .transaction {
            padding: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .transaction-info{
            flex: 1;
        }
        .transaction-info h3{
            margin-bottom: 5px;
            font-family: 17px;
        }
        .transaction-info p{
            color: #64748b;
            font-size: 14px;
        }
        .amount{
            font-weight: bold;
        }
        .amount.income-text{
            color: #16a34a;
        }
        .amount.expense-text{
            color: #dc2626;
        }
        .delete-btn{
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            background: #fee2e2;
            color: #dc2626;
            cursor: pointer;
        }
        .delete-btn:hover{
            background: #dc2626;
            color: white;
        }
        .empty{
            padding: 25px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>Expense Tracker</h1>
            <p>Track your income and daily expense.</p>
        </div>
        <section class="summary">
            <div class="summary-card income">
                <p>Total Income</p>
                <h2>&#8377;<span id="income">0</span></h2>
            </div>
            <div class="summary-card expense">
                <p>Total Expense</p>
                <h2>&#8377;<span id="expense">0</span></h2>
            </div>
            <div class="summary-card balance">
                <p>Balance </p>
                <h2>&#8377;<span id="balance">0</span></h2>
            </div>

        </section>
        <section class="form-box">
            <h2>Add Transaction</h2>

           <div class="form-grid">
            <input type="text" id="title" placeholder="Transaction name">
            <select id="type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
            <input type="number" id="amount" placeholder="Amount">
           </div>
           <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
        </section>
        
        <section class="transacton-box">
            <h2>Transaction</h2>
            <div id="transactionList">
                <p class="emtpy">No transaction added</p>
            </div>
        </section>
    </main>

    <script>
        let transactions = [];
        function addTransaction(){
            let title = document.getElementById("title").value.trim();
            let type = document.getElementById("type").value;
            let amount = Number(document.getElementById("amount").value);

            if(title === "" || amount <= 0) {
                alert("Enter a valid transaction.");
                return;
            }
            let transaction = {
                title: title,
                type: type,
                amount: amount
            };
            transactions.push(transaction);
            clearForm();
            displayTransactions();
        }
        function displayTransactions(){
            let list = document.getElementById("transactionList");
            list.innerHTML = "";

            transactions.forEach(function(item, index){
                let transaction = document.createElement("div");
                transaction.className = "transaction";

                let sign = item.type === "income" ? "+" : "-";
                let amountClass = item.type === "income" ? "income-text" : "expense-text";

                transaction.innerHTML = `
                <div class="transaction-info">
                    <h3>${item.title}</h3>
                    <p>${item.type}</p>
                    </div>
                    <span class="amount $ (amountClass)">${sign} ₹${item.amount}</span>
                    <button class="delete-btn" onclick="deleteTransaction(${index})">Delete</button>
                    `;
                    list.appendChild(transaction);
            });
            if (transactions.length === 0) {
                list.innerHTML = `<p class="empty">No transaction added.</p>`;
            }
            calculateTotal();
        }
        function calculateTotal(){
            let income = 0;
            let expense = 0;
            transactions.forEach(function(item){
                if(item.type === "income") {
                    income += item.amount;
                } else{
                    expense += item.amount;
                }
            });
            document.getElementById("income").innerHTML = income;
            document.getElementById("expense").innerHTML = expense;
            document.getElementById("balance").innerHTML = income - expense;
        }
        function deleteTransaction(index){
            transactions.splice(index, 1);
            displayTransactions();
        }
        function clearForm(){
            document.getElementById("title").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("type").value = "expense";
        }
    </script>
</body>
</html>
