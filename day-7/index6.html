<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );
    padding: 30px;
        }
        .container{
            width: 450px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }
        h1{
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .subtitle{
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        .form-group{
            margin-bottom: 20px;
        }
        .form-group label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        .form-group input{
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: .3s;
        }
        .form-group input:focus{
            border-color: #667eea;
        }
        .error{
            color: red;
            font-size: 13px;
            margin-top: 6px;
            display: block;
        }
        .success-input{
            border-color: #28a745 !important;
        }
        .error-input{
            border-color: red !important;
        }
        button{
            width: 100%;
            padding: 15px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
        }
        button:hover{
            background: #5363d8;
            transform: translateY(-2px);
        }
        #succesMessage{
            margin-top: 20px;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Fill the form to register.</p>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter Your name">
                <span class="error" id="nameError"></span>
            </div>
           <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter Your email">
            <span class="error" id="emailError"></span>
           </div>
           <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Your password">
            <span class="error" id="emailError"></span>
           </div>
           <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="comfirmPassword" placeholder="Confirm password ">
            <span class="error" id="emailError"></span>
           </div>
           <button type="submit">
            Create Account
        </button>
           <div id="successMessage">
            Account created successfully!  🎉
        </div>
        </form>
    </div>
    <script>
        let form = document.getElementById("registerForm");
        form.addEventListener(
                 "submit",
            function(event){
                event.preventDefault();
                let name =
                document.getElementById("name").value.trim();
                let email =
                document.getElementById("email").value.trim();
                let password =
                document.getElementById("password").value;
                let confirmPassword =
                document.getElementById("confirmPassword").value;

                let valid = true;
                document.getElementById("nameError")
                .innerHTML="";
                document.getElementById("emailError")
                .innerHTML="";
                document.getElementById("passwordError")
                .innerHTML="";
                document.getElementById("confirmError")
                .innerHTML="";
                if(name === ""){
                    document.getElementById("nameError")
                    .innerHTML = 
                    "Name is required";
                    vaild = false;
                }
                if(email === ""){
                    document.getElementById("emailError")
                    .innerHTML = 
                    "Email is required";
                    valid = false;
                }
                else if(!email.includes("@")){
                    document.getElementById("emailError")
                    .innerHTML = 
                    "Enter a valid email";
                    valid = false;
                }
                if(password === ""){
                    document.getElementById("passwordError")
                    .innerHTML= 
                    "password is required";
                    valid = false;
                }
                else if(password.length <6){
                    document.getElementById("passwordError")
                    .innerHTML = 
                    "password must have 6 characters"
                    valid = false;
                }
                if(confirmPassword === ""){
                    document.getElementById("confirmError")
                        .innerHTML = 
                        "Confirm your password";
                        valid = false;

                    
                }
                else if(password !== confirmPassword){
                    document.getElementById("confirmError")
                    .innerHTML= 
                    valid = false;
                }
                if(valid === true){
                    document.getElementById(
                        "successMessage"
                    ).style.display="block";
                    form.reset();
                }
            }
        )
    </script>
</body>
</html>
