<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            width: 900px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow:0 20px 40px rgba(0,0,0,.3);
        }
        h1{
            margin-bottom: 30px;
        }
        .palette{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .color{
            height: 220px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: .3s;
        }
        .color:hover{
            transform: translateY(-10px);
        }
        button{
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }
        button:hover{
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Color Palette</h1>
        <div class="palette">
            <div class="color"></div>
            <div class="color"></div>
            <div class="color"></div>
            <div class="color"></div>
            <div class="color"></div>
        </div>
        <button onclick="generatePalette()">Generate Palette</button>
    </div>
    <script>
        let boxes=document.querySelectorAll(".color");
        function randomColor(){
            let letters="0123456789ABCDEF";
            let color="#";
            for(let i=0;i<6;i++){
                color+=letters[Math.floor(Math.random()*16)];
            }
            return color;
        }
        function generatePalette(){
            boxes.forEach(function(box){
            let color=randomColor();
            box.style.background=color;
            box.innerHTML=color
            }
        );
        }
        generatePalette();
        boxes.forEach(function(box){
            box.addEventListener("click",function(){
                navigator.clipboard.writeText(box.innerHTML);
                alert("Copied:"+box.innerHTML);
            })
        })
    </script>
</body>
</html>
