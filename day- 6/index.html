<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
   }
   body{
    background: #f4f4f4;
   }
   header{
    background: #3498db;
    color: white;
    text-align: center;
    padding: 20px;
   }
   nav{
    background: #2c3e50;
    text-align: center;
    padding: 15px;
   }
   nav a{
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-size: 18px;
   }
   nav a:hover{
    color: yellow;
   }
   .container{
    width: 80%;
    max-width: 700px;
    background: white;
    margin: 40px auto;
    padding: 30px;
    border-radius: 10px;
     box-shadow:0 0 10px rgba(0,0,0,0.2);
     text-align: center;
   }
   .container p{
    line-height: 28px;
    margin-bottom: 20px;
   }
   button{
    background: #3498db;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
   }
   button:hover{
    background: #2980b6;
   }
   footer{
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
   }
    </style>
    
</head>
<body>
   <header>
    <h1>My First Simple Website</h1>
   </header> 
   <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
   </nav>
   <div class="container">
    <h2>Welcome</h2>
    <p>This is my Day 6 coding practice. I am learning HTML and CSS.
        Every day I build a new webpage to improve mmy coding speed and web development skills.
    </p>
    <button>Learn More</button>
   </div>
   <footer>
    <p>&copy; 2026 Day 6 Coding practice</p>
   </footer>
</body>
</html>
