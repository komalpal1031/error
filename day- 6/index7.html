<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
        }
        .container{
            width: 400px;
            background: white;
            border-radius: 20px;
            text-align: center;
            padding: 40px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }
        h1{
            color: #333;
            margin-bottom: 20px;
        }
        #clock{
            font-size: 55px;
            font-weight: bold;
            color: #0d6efd;
            margin: 20px 0;
        }
        #greeting{
            font-size: 28px;
            color: #444;
            margin-bottom: 25px;
        }
        button{
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: #0d6efd;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }
        button:hover{
            background: #084298;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Digital Clock</h1>
        <div id="clock">00:00:00</div>
        <div id="greeting">Welcome</div>
        <button onclick="changeColor()">
            Change Background
        </button>
    </div>
    <script>
        // funcation to display time 
        function showTime(){
            let now = new Date();
            let hour = now.getHours();
            let minuete = now.getMinutes();
            let second = now.getSeconds();
            if(hour<10){
                hour="0"+hour;
            }

            if(minuete<10){
                minuete="0"+minuete;
            }
            if(second<10){
                second="0"+second
            }
            document.getElementById("clock").innerHTML=hour+":"+minuete+":"+second;
            if(hour<12){
                document.getElementById("greeting").innerHTML="Good Morning"
            }
            else if(hour<17){
                document.getElementById("greeting").innerHTML="Good Afternoon"
            }
            else if(hour<20){
                document.getElementById("greeting").innerHTML="Good Night"
            }
        }
        // update every second
        setInterval(showTime,1000);
        showTime();
        // change background color
        function changeColor(){
        let colors=[
          "#1abc9c",
"#3498db",
"#9b59b6",
"#e74c3c",
"#16a085",
"#2ecc71",
"#f39c12",
"#f3f3f3",
"#34495e"  
        ];
        let random=Math.floor(Math.random()*colors.length);
        document.body.style.background=colors[random];
        }

    </script>
</body>
</html>
