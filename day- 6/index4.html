<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Google Clone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:Poppins, sans-serif;
    }
    body{
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: white;
    }
    header{
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 18px 35px;
        gap: 20px;
    }
    header a{
        text-decoration: none;
        color: #222;
        font-size: 14px;
    }
    header a:hover{
        text-decoration: underline;
    }
    .apps{
     width: 40px;
     height: 40px;
     display: flex;
     justify-content: center;
     align-items: center;
     border-radius: 50%;
     cursor: pointer;
     transition: .3s;
    }
    .apps:hover{
        background: #f1f3f4;
    }
    .profile{
        width: 42px;
        height: 42px;
        border-radius: 50%;
        overflow: hidden;
        cursor: pointer;
    }
    .profile img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    main{
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .logo{
        font-size: 90px;
        font-weight: 600;
        margin-bottom: 30px;
    }
    .logo span:nth-child(1){color:#4285f4;}
    .logo span:nth-child(2){color:#EA4335;}
.logo span:nth-child(3){color:#FBBC05;}
.logo span:nth-child(4){color:#4285F4;}
.logo span:nth-child(5){color:#34A853;}
.logo span:nth-child(6){color:#EA4335;}

.search{
    width: 700px;
    max-width: 90%;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border: 1px solid #ddd;
    border-radius: 50px;
    transition: .3s;
}
.search:hover{
   box-shadow:0 2px 10px rgba(0,0,0,.15); 
}
.search input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    padding: 0 15px;
}
.search i{
    color: #777;
    font-size: 18px;
}
.buttons{
    margin-top: 35px;
    display: flex;
    gap: 15px;
}
button{
    padding: 12px 25px;
    background: #f8f9fa;
    border: 1px solid #dadce0;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    transition: .3s;
}
button:hover{
    border: 1px solid #999;
}
.language{
    margin-top: 30px;
    font-size: 15px;
}
.language a{
    text-decoration: none;
    margin: 0 6px;
    color: #1a73e8;
}
footer{
    background: #f2f2f2;

}
.country{
    padding: 15px 35px;
    border-bottom: 1px solid #ddd;
    color: #555;
}
.bottom{
    display: flex;
    justify-content: space-between;
    padding: 15px 35px;
    flex-wrap: wrap;
}
.left,
.right{
    display: flex;
    gap: 25px;
}
.bottom a{
    text-decoration: none;
    color: #555;
    font-size: 14px;
}
.bottom a:hover{
    text-decoration: underline;
}
</style>
</head>
<body>
   <header>
    <a href="#">Gamil</a>

    <a href="#">Images</a>
    <div class="apps">
        <i class="fa-solid fa-grip"></i>
    </div>
    <div class="profile">
     <img src="https://picsum.photos/100" alt="Profile">
    </div>
   </header> 
   <main>
    <div class="logo">
        <span>G</span>
        <span>o</span>
        <span>o</span>
        <span>g</span>
        <span>l</span>
        <span>e</span>
    </div>
    <div class="search">
     <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search Google or type a URl">
        <i class="fa-solid fa-microphone"></i>
    </div>
    <div class="buttons">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
    </div>
    <div class="language">
      Google offered in:
        <a href="#">हिन्दी</a>
        <a href="#">বাংলা</a>
        <a href="#">తెలుగు</a>
        <a href="#">தமிழ்</a>
        <a href="#">ગુજરાતી</a>
    </div>
   </main>
   <footer>
    <div class="country">
        India
    </div>
    <div class="bottom">
        <div class="left">
            <a href="#">About</a>
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How Search Works</a>
        </div>
        <div class="right">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Setting</a>
        </div>
    </div>
   </footer>
</body>
</html>
