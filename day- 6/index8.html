<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }
        .container{
            width: 400px;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow:0 15px 30px rgba(0,0,0,.2);
        }
        h1{
            margin-bottom: 20px;
            color: #333;
        }
        #count{
            font-size: 70px;
            font-weight: bold;
            color: #0d6efd;
            margin: 30px 0;
        }
        .buttons{
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button{
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }
        button:hover{
            transform: translateY(-3px);
        }
        .plus{
            background: #28a745;
            color: white;
        }
        .minus{
            background: #dc3545;
            color: white;
        }
        .reset{
            background: #ffc107;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter App</h1>
        <div id="count">0</div>
        <div class="buttons">
            <button class="plus" onclick="increase()">+</button>
            <button class="minus" onclick="decrease()">-</button>
            <button class="reset" onclick="resetCounter()">Reset</button>
        </div>
    </div>

    <!-- script -->
     <script>
        let count = 0;
        function updateCounter(){
            document.getElementById("count").innerHTML = count;
            if(count > 0){
                document.getElementById("count").style.color = "green;"
            }
            else if(count < 0){
                document.getElementById("count").style.color = "red";
            }
            else{
                document.getElementById("count").style.color = "#0d6efd"
            }
        }
        function increase(){
            count++;
            updateCounter();
        }
        function decrease(){
            count--;
            updateCounter();
        }
        function resetCounter(){
            count = 0;
            updateCounter();
        }
        updateCounter();
     </script>
</body>
</html>
