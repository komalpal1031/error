<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
 *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
 body{

background:#eef2ff;

display:grid;

grid-template-columns:260px 1fr;

min-height:100vh;

}  
.sidebar{
    background: #111827;
    padding: 30px;
    color: white;
    pad
}
.logo{
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 50px;
}
.menu{
    list-style: none;
}
.menu li{
    margin: 10px 0;
}
.menu a{
    color: #d1d5db;
    text-decoration: none;
    display: block;
    padding: 14px;
    border-radius: 10px;
    transition: 3s;
}
.menu a:hover{
    background: #2563ed;
    color: white;
}
.main{
    padding: 40px;
}
.top{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
}
.search{
    width: 350px;
    padding: 14px;

    border: none;
    border-radius: 10px;
    outline: none;
}
.profile img{
    
        width: 55px;
        height: 55px;
        border-radius: 50%;
    
}
.cards{
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 20px;
  margin-bottom: 40px;
}
.card{
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    transition: 3s;

}
.card:hover{
    transform: translateY(-8px);
}
.card h2{
    color: #2563ed;
    margin-bottom: 10px;
}
.layout{
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
}
.chats{
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.bars{
    height: 250px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 30px;
}
.bar{
    width: 45px;
    background: #2563ed;
    border-radius:10px 10px 0 0;
}
.bar:nth-child(1){height: 80px;}
.bar:nth-child(2){height:150px;}
.bar:nth-child(3){height:120px;}
.bar:nth-child(4){height:210px;}
.bar:nth-child(5){height:170px;}
.bar:nth-child(6){height:240px;}

.right{
    display: flex;
    flex-direction: column;
    gap: 25px;
}
.box{
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.progress{
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}
.fill{
    height: 100%;
    background: #2563ed;
    width: 78%;
}
.member{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 15px 0;
}
.member img{
    width: 45px;
    height: 45px;
    border-radius: 50%;
}
</style>
</head>
<body>
    <aside class="sidebar">
      <div class="logo">
        DashPro
      </div>
      <ul class="menu">
       <li><a href="#">Dashboard</a></li>
       <li><a href="#">Analytics</a></li>
       <li><a href="#">Projects</a></li>
       <li><a href="#">Messages</a></li>
       <li><a href="#">Tasks</a></li>
       <li><a href="#">Reports</a></li>
       <li><a href="#">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
     <div class="top">
        <input type="search" placeholder="Search....">
        <div class="profile">
            <img src="https://picsum.photos/100">
            <h3>Komal Pal</h3>
         </div>
     </div>
     <section class="cards">
        <div class="card">
            <h2>$25K</h2>
            <p>Total Revenue</p>
        </div>
        <div class="card">
            <h2>320</h2>
            <p>Orders </p>
        </div>
        <div class="card">
            <h2>96%</h2>
            <p>Growth </p>
        </div>
        <div class="card">
            <h2>1,787</h2>
            <p>Customers</p>
        </div>

     </section>
     <section class="layout">
      <div class="chart">
        <h2>Monthly Revenue</h2>
        <div class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
      </div>
     <div class="right">
        <div class="box">
            <h3>Project Progress</h3>
            <div class="progress">
                <div class="fill"></div>
            </div>
        </div>
        <div class="box">
            <h3>Team Members</h3>
            <div class="member">
             <img src="https://picsum.photos/101">
             <p>Alex johnson</p>   
            </div>
            <div class="member">
              <img src="https://picsum.photos/102">
              <p>Sarah Lee</p>  
            </div>
            <div class="member">
                <img src="https://picsum.photos/103">
                <p>Michael Smith</p>

            </div>
        </div>
     </div>
     </section>
    </main>
</body>
</html>
