<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Profile Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
    *{
        margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

    }
    body{

background:linear-gradient(135deg,#4f46e5,#06b6d4);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}
.card{
    width: 430px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    transition: 4s;
    padding: 20px;
}
.card:hover{
    transform: translateY(-10px);
}
.cover{
    height: 170px;
    background:url("https://picsum.photos/600/300?random=20");
    background-size: cover;
    background-position: center;
    position: relative;
}
.profile{
    position: absolute;
    bottom: -60px;
    left: 50px;
    transform: translateY(-50%);
}
.profile img{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 6px solid white;
    object-fit: cover;
}
.conntent{
    padding: 80px 30px 30px;
    text-align: center;
}
.conntent h{
    margin-bottom: 8px;
}
.job{
    color: #666;
    margin-bottom: 20px;
}
.bio{
    color: #555;
    line-height: 1.7;
    margin-bottom: 25px;
}
.buttons{
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-bottom: 30px;
}
.buttons button{
    padding: 12px 25px;
    border: none;
    border-radius: 30px ;
    cursor: pointer;
    font-size: 15px;
    transition: 3s;
}
.follow{
    background: #4f46e5;
    color: white;
    padding: 6px;
    border: none;
    border-radius: 6px;

}
.message{
    background: #e5e7eb;
    padding: 6px;
    border: none;
    border-radius: 6px;
    
}
.buttons button:hover{
    transform: scale(1.05);
}
.social{
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
    gap: 20px;
}
.social i{
    width: 45px;
    height: 45px;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: 3s;
}
.social i:hover{
    background: #4f46e5;
    color: white;
}
.stats{
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}
.stat{
    flex: 1;
}
.stat h3{
    color: #4f46e5;
}
.skills h3{
    margin-bottom: 20px;
    text-align: left;
}
.skill{
    margin-bottom: 20px;
}
.skill span{
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}
.bar{
    height: 10px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}
.fill{
    height: 100%;
    background: #4f46e5;
}
.html{
    width: 95%;
}
.css{
    width: 90%;
}
.javascript{
    width: 75%;
}
footer{
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
    font-size: 14px;
    color: #777;
}
</style>
</head>
<body>
    <div class="card">
        <div class="cover">
            <div class="profile">
              <img src="https://picsum.photos/200?random=25">  
            </div>
        </div>
        <div class="content">
            <h2>Komal Pal</h2>
            <p class="job">Forntend Developer</p>
            <p class="bio">Passionate about creating responsive website using HTML and CSS. Always learnig new techologies and improving coding skills</p>
            <div class="button">
                <button class="follow">Follow</button>
                <button class="message">Message</button>
            </div>
            <div class="social">
              <i class="fab fa-facebook-f"></i>
               <i class="fab fa-instagram"></i>
               <i class="fab fa-linkedin-in"></i> 
               <i class="fab fa-github"></i>
            </div>
            <div class="stats">
                <div class="stat">
                    <h3>250</h3>
                    <p>Project</p>
                </div>
                <div class="stat">
                    <h3>18K</h3>
                    <p>Followers</p>
                </div>
                <div class="stat">
                    <h3>780</h3>
                    <p>Following</p>
                </div>
            </div>
            <div class="skills">
                <h3>Skills</h3>
                <div class="skill">
                    <span>HTML</span>
                    <div class="bar">
                        <div class="fill html"></div>
                    </div>
                </div>
                <div class="skill">
                    <span>CSS</span>
                    <div class="bar">
                        <div class="fill css"></div>
                    </div>
                </div>
                <div class="skill">
                    <span>javaScript</span>
                    <div class="bar">
                        <div class="fill Javascript"></div>
                    </div>
                </div>

            </div>
            <footer>
                Designed with &hearts; using HTML & CSS
            </footer>
        </div>
    </div>
</body>
</html>
