<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background:linear-gradient(135deg,#3b82f6,#9333ea);
    padding: 20px;

}
.container{
    width: 420px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    text-align: center;
}
.icon{
    width: 80px;
    height: 80px;
    margin: auto;
    border-radius: 50%;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20xp;
}
.icon i{
    font-size: 35px;
    color: #4f46e5;
}
h1{
    margin-bottom: 10px;
    color: #222;
}
p{
    color: #666;
    margin-bottom: 30px;
    line-height: 1.6;
}
.input-box{
    position: relative;
    margin-bottom: 20px;
}
.input-box i{
    position: absolute;
    left: 15px;
    top: 16px;
    color: #666;
}
.input-box input{
    width: 100%;
    padding: 14px 14px 14px 45px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: 3s;
}
.input-box input:focus{
    border-color: #4f46e5;
    box-shadow:0 0 10px rgba(79,70,229,.3);
}
button{
    width: 100%;
    padding: 15px;
    background: #4f46e5;
    color: white;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 3s;
    margin-bottom: 25px;
}
button:hover{
    background: #312e81;
    transform: translateY(-3px);
}
.otp{
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}
.otp input{
    width: 60px;
    height: 60px;
    font-size: 24px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    transition: 3s;
}
.otp input:focus{
    border-color: #4f46e5;
}
.links{
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}
.links a{
    text-decoration: none;
    color: #4f46e5;
    font-weight: 600;
}
.link a:hover{
    text-decoration: underline;
}
</style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <h1>Forgot Password</h1>
        <p>Enter your registered email address to receive a verification code.</p>
        <form>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
            <input type="emal" placeholder="Enter Email Address" required>
            </div>
            <button>Send Verification Code</button>
            <div class="otp">
                <input type="text" maxlength="1">
                 <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
                   <input type="text" maxlength="1">
            </div>
            <button>Verify OTP</button>
        </form>
        <div class="links">
            <a href="#">Back to Login</a>
            <a href="#">Resend OTP</a>
        </div>
    </div>
</body>
</html>
