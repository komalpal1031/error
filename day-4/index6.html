<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary:#2563ed;
            --secondary:#0ea5e9;
            --dark:#1e293d;
            --light:#ffffff;
            --gray:#f8fafc;
        }
        *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:var(--gray);
}
header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 70px;
    background: white;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    position: sticky;
    top: 0;
    z-index: 100;
}
nav a{
    text-decoration: none;
    margin-left: 25px;
    color: #333;
    transition: 3s;
}
nav a:hover{
    color: var(--primary);
}
.hero{
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=1600");
background-size: cover;
background-position: center;
color: white;
padding: 20px;

}
.hero h1{
    font-size: 60px;
    margin-bottom: 20px;
}
.hero p{
    margin-bottom: 30px;
    font-size: 18px;
}
.search{
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    max-width: 900px;
    margin: auto;
}
.search input,
.search select{
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
}
.search button{
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.title{
    text-align: center;
    font-size: 40px;
    margin: 70px 0 40px;
}  
.property{
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
    transition: 3s;
} 

.property:hover{
    transform: translateY(-10px
);
.property img{
    width: 100%;
    height: 220px;
    object-fit: cover;
}
.info{
    padding: 20px;
}
.price{
    color: var(--primary);
    font-size: 26px;
    font-weight: 600;
    margin: 10px 0;
}
.info button{
    width: 100%;
    padding: 12px;
    border: none;
    background: var(--primary);
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
.features{
    width: 90%;
    margin: 80px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}
.feature{
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 15px;
}
.agents{
    width: 90%;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}
.agnet{
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 15px;
}
.agent img{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-bottom: 20px;
}
.contact{
    width: 60%;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}
.contact input,
.contact textarea{
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}
.contact button{
    padding: 14px 30px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
}
footer{
    margin-top: 80px;
    background: var(--dark);
    color: white;
    padding: 40px;
    text-align: center;

}
}
    </style>
</head>
<body>
    <header>
        <div class="logo">
           <i class="fa-solid fa-house"></i>
            DreanHome
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Properties</a>
            <a href="#">Agents</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <div>
            <h1>Find Your Dream Home</h1>
            <p>Luxuay apartments, villas, and family homes in your favorite locations.</p>
            <div class="search">
                <input type="text" placeholder="City">
                <select>
                    <option>Apartment</option>
                    <option>Villa</option>
                    <option>Office</option>
                </select>
                <input type="text" placeholder="Budget">
                <button>Search</button>
            </div>
        </div>
    </section>
    <h2 class="title">Featured Properties</h2>
    <section class="properties"></section>
    <h2 class="title">Why Choose Us?</h2>
    <section class="features">
    <div class="feature">
       <i class="fa-solid fa-shield"></i>
       <h3>Trusted</h3> 
    </div>
    <div class="feature">
        <i class="fa-solid fa-shield"></i>
        <h3>Secure Deals</h3>
    </div>
     <div class="feature">
        <i class="fa-solid fa-shield"></i>
        <h3>Affordable</h3>
    </div>
     <div class="feature">
        <i class="fa-solid fa-shield"></i>
        <h3>24/7 Support</h3>
    </div>
    </section>
    <footer>
        <h2>DreanHome Real Estate</h2>
        <p>Helping You Find the Perfect Property.</p>
    </footer>
</body>
</html>
