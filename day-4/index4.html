<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --gold:#d4af37;
            --black:#111;
            --white:#fff;
            --gray:#f5f5f5;
            --shadow:0.15px 35px rgba(0,0,0,.15);
        }
        *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'poppins',sans-serif;
        }
        body{
            background: var(--gray);
        }
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 70px;
            background: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo{
            font-size: 30px;
            font-weight: bold;
            color: var(--gold);
        }
        nav a{
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            transition: 3s;
        }
        nav a:hover{
            color: var(--gold);
        }
        .hero{
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 80px;
            min-height: 90vh;
        }
        .hero-text h1{
            font-size: 60px;
            margin-bottom: 20px;
        }
        .hero-text span{
            color: var(gold);
        }
        .hero-text p{
            font-size: 18px;
            color: #666;
            margin-bottom: 35px;
        }
        .hero button{
            padding: 15px 35px;
            border: none;
            cursor: pointer;
            margin-right: 15px;
            border-radius: 40px;
            font-size: 16px;
            transition: 3s;
        }
        .shop{
            background: var(--gold);
            color: white ;
        }
        .learn{
            background: #111;
            color: white;
        }
        .hero button:hover{
            transform: translateY(-5px);
        }
        .hero-image img{
            width: 420px;
            transition: .5s;
        }
        .hero-image img:hover{
            transform: scale(1.08)
            rotate(-5deg);
        }
        .stats{
           width: 90%;
           margin: auto;
           display: grid;
           grid-template-columns: repeat(4,1fr);
           gap: 20px;
           margin-bottom: 80px; 
        }
        .stat{
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }
        .stat h2{ 
           color: var(--gold);
        }
        .title{
            text-align: center;
            font-size: 40px;
            margin-bottom: 40px;
        }
        .products{
            width: 90%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 25px;
        }
        .card{
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 4s;
        }
        .card:hover{
            transform: translateY(-10px);
        }
        .card img{
            width: 100%;
            height: 260px;
            object-fit: cover;
        }
        .content{
            padding: 20px;
        }
        .price{
            color: var(--gold);
            font-size: 24px;
            margin: 10px 0;
        }
        .buy{
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: white;
            border: none;
            cursor: pointer;
        }
        .features{
            width: 90%;
            margin: 80px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .feature{
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 15px;
        }
        .feature i{
            font-size: 45px;
            color: var(--gold);
            margin-bottom: 20px;
        }
        footer{
            background: #111;
            color: white;
            text-align: center;
            padding: 40px;
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-regular fa-clock"></i>
            LuxTime
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">collection</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
        </nav>
    </header>
    <section class="hero">
<div class="hero-text">
    <h1>Luxury <span>Watches</span>Collection</h1>
    <p>Timeless elegance crafted with precision for every occasion</p>
    <button class="shop">Shop Now</button>
    <button class="learn">Explore </button>
</div>
<div class="hero-image">
    <img src="imagejpg.jpg" alt="Luxury">
</div>
    </section>
    <section class="stats">
        <div class="stat">
            <h2>5000+</h2>
            <p>Happy Customers</p>
        </div>
        <div class="stat">
            <h2>25+</h2>
            <p>years Experience</p>
        </div>
        <div class="stat">
            <h2>120+</h2>
            <p>Luxury Brand</p>
        </div>
        <div class="stat">
            <h2>99%</h2>
            <p>Satisfaction </p>
        </div>
    </section>
    <footer>
        <h2>LuxTime</h2>
        <p>Luxury You Can Wear</p>
    </footer>
</body>
</html>
