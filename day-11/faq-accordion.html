<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="container">
        <section class="left">
             <p class="tag">Help Center</p>
             <h1>Frequently Asked Questions</h1>
             <p>Find quick answers to some of the most common questions about our service.</p>
             <button class="contact-btn" onclick="showMessage()">Contact Support</button>
         </section>
         
         <section class="faq-list">
            <div class="faq active">
                <button class="question">How do I create an account?<span class="icon">+</span></button>
                <div class="answer">
                    <p>Click the sign up button, enter your details and create your account in a few simple steps.</p>
                </div>
            </div>
            <div class="faq">
                <button class="question">Can I change my password? <span class="icon" >+</span></button>
                <div class="answer">
                    <p>Yes. Open your account setting and select the change password option.</p>
                </div>
            </div>
            <div class="faq">
                <button class="question">How can I delete my account? <span class="icon">+</span></button>
            </div>
         </section>
    </main>
</body>
</html>
