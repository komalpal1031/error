<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            padding: 20px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 500px;
            max-width: 100%;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }
        icon{
            width: 55px;
            height: 55px;
            margin-bottom: 20px;
            background: #dbeafe;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }
        h1{
            margin-bottom: 8px;
            color: #1e3a8a;
            font-size: 30px;
        }
        .subtitle{
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.5;
        }
        .password-box{
            position: relative;
        }
        .password-box input{
            width: 100%;
            padding: 13px 70px 13px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        .password-box input:focus{
            border-color: #2563eb;
        }
        .show-btn{
            border: none;
            background: none;
            color: #2563eb;
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .strength-bar{
            height: 8px;
            margin-top: 18px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar{
            width: 0;
            height: 100%;
            transform: 0.3s;
        }
        .strength-info{
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        .strength-info span{
            color: #64748b;
            font-size: 14px;
        }
        #strength{
            font-weight: bold;
        }
        .requirements{
            margin-top: 28px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }
        .requirements h3{
            margin-bottom: 15px;
            font-size: 16px;
        }
        .rule{
            margin-bottom: 11px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .rule:last-child{
            margin-bottom: 0;
        }
        .rule.valid{
            color: #16a34a;
        }
        .dot{
            width: 9px;
            height: 9px;
            background: #cdb5e1;
            border-radius: 50%;
        }
        .rule.valid .dot{
            background: #16a34a;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">🔐</div>
        <h1>Password Checker</h1>
        <p class="subtitle">Create a stronger password by completing the requiremnets below.</p>
        <div class="password-box">
            <input type="password" id="password" placeholder="Enter password....">
            <button class="show-btn" is="showBtn" onclick="togglePassword()">Show</button>
        </div>
        <div class="strength-bar">
            <div class="bar" id="bar"></div>
        </div>
        <div class="strength-info">
            <span>Password Strength</span>
            <span id="strength">None</span>
        </div>
        <section class="requiremnets">
            <h3>Password Requirements</h3>
            <div class="rule" id="lengthRule">
                <span class="dot"></span>At least 8 characters
            </div>
            <div class="rule" id="upperRule">
                <span class="dot"></span>
             One uppercase letter
            </div>
             <div class="rule" id="lowerRule">
                <span class="dot"></span>
             One lowercase letter
            </div>
             <div class="rule" id="numberRule">
                <span class="dot"></span>
             One number 
            </div>
             <div class="rule" id="symbolRule">
                <span class="dot"></span>
             One special character
            </div>
        </section>
    </main>
    <script>
        let passwordInput = document.getElementById("password");

        passwordInput.addEventListener("input", checkPassword);
        function checkPassword(){
            let password = passwordInput.value;
            let score = 0;

            let hasLength = password.length >= 8;
            let hasUpper = /[A-Z]/.test(password);
            let hasLower = /[a-z]/.test(password);
            let hasNumber = /[0-9]/.test(password);
            let hasSymbol = /[^A-Za-z0-9]/.test(password);

            if (hasLength) score++;
            if (hasUpper) score++;
            if (hasLower) score++;
            if (hasNumber) score++;
            if (hasSymbol) score++;

            updateRule("lengthRule", hasLength);
            updateRule("upperRule", hasUpper);
            updateRule("lowerRule", hasLower);
            updateRule("numberRule", hasNumber);
            updateRule("symbolRule", hasSymbol);

         updateStrength(score, password);
        }
        function updateRule(id, valid){
            let rule = document.getElementById(id);
            if (valid){
                rule.classList.add ("valid");
            } else {
                rule.classList.remove("valid");
            }
        }
        function updateStrength(score, password){
            let bar = document.getElementById("bar");
            let strength = document.getElementById("strength");
            if(password === ""){
                bar.style.width = "0";
                strength.innerHTML = "none";
                return;
            }
            if (score <= 2) {
                bar.style.width = "33%";
                bar.style.background = "#dc2626";
                strength.innerHTML = "weak";
                strength.style.color = "#dc2626";
            } else if (score <= 4) {
                bar.style.width = "66%";
                bar.style.background = "#f59e0b";
                strength.innerHTML = "Medium";
                strength.style.color = "#f59e0b";

            } else {
                bar.style.width = "100%";
                bar.style.background = "#16a34a";
                strength.innerHTML = "Strong";
                strength.style.color = "#16a34a"
            }
        }
        function togglePassword(){
            let button = document.getElementById("showBtn");
            if (passwordInput.type === "password"){
                passwordInput.type = "text";
                button.innerHTML = "Hide";
            } else {
                passwordInput.type = "password";
                button.innerHTML = "Show";
            }
        }
    </script>
</body>
</html>
