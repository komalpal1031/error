<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body{
            min-height: 100vh;
            padding: 30px 20px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider{
            width: 850px;
            max-width: 100%;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        .image-box{
            height: 480px;
            position: relative;
            overflow: hidden;
        }
        .image-box img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay{
            position: absolute;
            inset: 0;
            padding: 40px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            display: flex;
            justify-content: flex-end;
            flex-direction: column;
        }
        .overlay h1{
            margin-bottom: 8px;
            font-size: 36px;
        }
        .overlay p{
            color: #e2e8f0;
        }
        .arrow{
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            color: #111827;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            cursor: pointer;
            z-index: 2;
        }
        .arrow:hover{
            background: white;
        }
        .prev{
            left: 20px;
        }
        .next{
            right: 20px;
        }
        .bottom{
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dots{
            display: flex;
            gap: 8px;
        }
        .dot{
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            background: #cbd5e1;
            cursor: pointer;
        }
        .dot.active{
            width: 25px;
            border-radius: 10px;
            background: #2563eb;
        }
        .counter{
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="slider">
      <div class="image-box">
        <img id="sliderImage" src="" alt="Slider Image">
        <button class="arrow prev" onclick="previousSlide()">‹</button>
        <button class="arrow next" onclick="nextSlide()">›</button>
        <div class="overlay">
            <h1 id="title"></h1>
            <p id="description"></p>
        </div>
      </div>
      <div class="bottom">
        <div class="dots" id="dots"></div>
        <p class="counter" id="counter"></p>
      </div>
    </main>
    <script>
        let slides = [
            {
                image:  "https://picsum.photos/900/500?random=101",
                title: "Explore Nature",
                description: "Discover beautiful places around the world."
            },
             {
                image:  "https://picsum.photos/900/500?random=102",
                title: "Mountain Adventure",
                description: "Experience the beauty of high mountains"
            },
             {
                image:  "https://picsum.photos/900/500?random=103",
                title: "City Life",
                description: "Explore modern cities and their architecture"
            },
             {
                image:  "https://picsum.photos/900/500?random=104",
                title: "Ocean Escape",
                description: "Relax and enjoy peaceful ocean views."
            },
        ];
        let currentSlide = 0;
        function showSlide(){
            let slide = slides[currentSlide];

            document.getElementById("sliderImage").src = slide.image;
            document.getElementById("title").innerHTML = slide.title;
            document.getElementById("description").innerHTML = slide.description;

            document.getElementById("counter").innerHTML = 
            (currentSlide + 1) + " / " + slides.length;
            updateDots();
        }
        function nextSlide(){
            currentSlide++;

            if (currentSlide >= slides.length){
                currentSlide = 0;
            }
            showSlide();
        }
        function previousSlide(){
            currentSlide--;
            if (currentSlide < 0){
                currentSlide = slides.length - 1;
            }
            showSlide();
        }
        function createDots(){
            let dotsBox = document.getElementById("dots");
            slides.forEach(function(slide, index){
                let dot = document.createElement("button");
                dot.className = "dot";

                dot.addEventListener("click", function(){
                    currentSlide = index;
                    showSlide();
                });
                dotsBox.appendChild(dot);
            });
        }
        function updateDots(){
            let dots = document.querySelectorAll(".dot");

            dots.forEach(function(dot, index){
                dot.classList.remove("active");

                if(index === currentSlide){
                    dot.classList.add("active");
                }
            });
        }
        createDots();
        showSlide();

        setInterval(function(){
            nextSlide();
        }, 4000);
    </script>
</body>
</html>
