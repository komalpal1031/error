<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            padding: 30px 20px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz{
            width: 600px;
            max-width: 100%;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
        }
        .top{
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top h1{
            font-size: 27px;
            color: #312e81;
        }
        .question-number{
            padding: 7px 13px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 20px;
            font-size: 14px;
        }
        .progress{
            height: 8px;
            margin-bottom: 30px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar{
            width: 0;
            height: 100%;
            background: #4f46e5;
            transition: 0.3s;
        }
        #question {
            margin-bottom: 25px;
            font-size: 22px;
            line-height: 1.5;
        }
        .options{
            display: grid;
            gap: 12px;
        }
        .option{
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #cbd5e1;
            background: white;
            color: #334155;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }
        .option:hover{
            border-color: #4f46e5;
            background: #eef2ff;
        }
        .option.correct{
            border-color: #16a34a;
            background: #dcfce7;
            color: #166534;
        }
        .option.wrong{
            border-color: #dc2626;
            background: #fee2e2;
            color: #991b1b;
        }
        .next-btn{
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        .next-btn:hover{
            background: #4338ca;
        }
        .result{
            display: none;
            text-align: center;
        }
        .result .icon{
            margin-bottom: 15px;
            font-size: 60px;
        }
        .result h2{
            margin-bottom: 10px;
            font-size: 30px;
        }
        .score {
            margin: 25px 0;
            color: #4f46e5;
            font-size: 45px;
            font-weight: bold;
        }
        .restart-btn{
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="quiz">
        <section id="quizBox">
            <div class="top">
                <h1>Frontend Quiz</h1>
                <span class="question-number" id="questionNumber">1 / 5</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <h2 id="question"></h2>
            <div class="options" id="options"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </section>

        <section class="result" id="result">
            <div class="icon">🏆</div>
            <h2>Quiz Completed!</h2>
            <p>your final score is </p>
            <div class="score"><span id="score">0</span></div>
            <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
        </section>
    </main>
   <script>
    let questions = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Text Machine Language",
                "Hyper Tool Markup language",
                "Home Text Markup Language"
            ],
            answer: "Hyper Text Markup Language"
        },
        {
            question: "Which property changes text color in CSS",
            options: [
                "font-color",
                "text-color",
                "color",
                "background-color"
            ],
            answer: "color"
        },
        {
            question: "Which keyword creates a variable in JavaScript?",
            options: [
                "style",
                "let",
                "html",
                "function-only"
            ],
            answer: "let"
        },
        {
            question: "Which symbol is used for an ID selector in CSS?",
            options: [
                ".",
                "#",
                "*",
                "@"
            ],
            answer: "#"
        },
         {
                question: "Which method selects an element by ID?",
                options: [
                    "queryElement()",
                    "getElementById()",
                    "selectId()",
                    "findElement()"
                ],
                answer: "getElementById()"
            }
        
    ];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function showQuestion(){
        answered = false;

        let data = questions[currentQuestion];
        let optionsBox = document.getElementById("options");

        document.getElementById("question").innerHTML = data.question;
        document.getElementById("questionNumber").innerHTML = 
        (currentQuestion + 1) + " / " + questions.length;

        document.getElementById("progressBar").style.width = 
        ((currentQuestion + 1) / questions.length * 100) + "%";

        document.getElementById("nextBtn").style.display = "none";

        optionsBox.innerHTML = "";
        data.options.forEach(function(option){
            let button = document.createElement("button");
            button.classList = "option";
            button.innerHTML = option;

            button.addEventListener("click", function(){
                selectAnswer(button, option);
            });
            optionsBox.appendChild(button);
        });
    }
    function selectAnswer(button, selectedAnswer) {
        if (answered) return;
        answered= true;
        let correctAnswer = questions[currentQuestion].answer;
        let buttons = document.querySelectorAll(".option");

        if (selectedAnswer === correctAnswer) {
            button.classList.add("correct");
            score++;
        } else {
            button.classList.add("wrong");

            buttons.forEach(function(btn){
                if (btn.innerHTML === correctAnswer){
                    btn.classList.add("correct");
                }
            });
        }
        document.getElementById("nextBtn").style.display = "block";
    }
    function nextQuestion(){
        currentQuestion++;
        
        if (currentQuestion < questions.length){
            showQuestion();
        } else {
            showResult();
        }
    }
    function showResult(){
        document.getElementById("quizBox").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("score").innerHTML = score;
    }
    function restartQuiz(){
        currentQuestion = 0;
        score = 0;

        document.getElementById("quizBox").style.display = "block";
        document.getElementById("result").style.display = "none";
        showQuestion();
    }
    showQuestion();
   </script> 
</body>
</html>
